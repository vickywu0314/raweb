<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b57d0"><link rel="icon" href="img/logo.svg" type="image/svg+xml"><link rel="stylesheet" href="css/common.css?v=53"><link rel="stylesheet" href="css/shared/case-form.css?v=53"><link rel="stylesheet" href="css/pages/patient-create.css?v=53"><script src="js/boot.js?v=53" defer></script><script src="js/data.js?v=53" defer></script><script src="js/common.js?v=53" defer></script><script src="js/shared/crf-schema.js?v=53" defer></script><script src="js/shared/case-form.js?v=53" defer></script><script src="js/pages/patient-create.js?v=53" defer></script><title>新增患者 · 患者数据研究平台</title></head><body>
<header class="app-header"><a class="brand" href="projects.html"><img src="img/logo.svg" width="38" height="38" alt=""><span>患者数据研究平台<small>Patient Data Research Platform</small></span></a><div class="header-actions"><nav class="header-knowledge-links" aria-label="学习与规范"><a href="learning-center.html">学习中心</a><a href="data-guide.html">使用指南</a></nav><label class="header-study"><select id="header-study-select" aria-label="当前研究数据库"><option value="">当前研究数据库</option><option value="ra">RA 类风湿关节炎研究库</option><option disabled>AS 强直性脊柱炎研究库 · Coming soon</option><option disabled>SS 系统性硬化症研究库 · Coming soon</option><option disabled>RA-ILD 研究库 · Coming soon</option><option disabled>RA-MS 肌少症研究库 · Coming soon</option><option disabled>FM 纤维肌痛研究库 · Coming soon</option></select></label><div class="account"><span class="avatar">陈</span><span>陈医生<small>研究者</small></span></div></div></header>
<div class="app-layout"><aside class="sidebar"><nav><a class="nav-item nav-primary nav-project-home" data-nav="projects" href="projects.html"><span class="nav-project-icon">▦</span>研究项目总览</a><div class="nav-separator"></div><p class="nav-label nav-work-label">研究工作台</p><a class="nav-item nav-primary" data-nav="dashboard" href="dashboard.html"><img src="img/chart.svg" alt="">数据看板</a><a class="nav-item nav-primary active" data-nav="patients" href="patients.html"><img src="img/users.svg" alt="">患者管理</a></nav><div class="sidebar-note"><span class="status-dot"></span> 当前：RA 多中心研究<small>新增患者与首次病例建档</small></div></aside>
<main id="main"><div class="breadcrumb"><a href="patients.html">患者管理 / 患者列表</a> <span>/</span> 新增患者</div><a class="back-link" href="patients.html">← 返回患者列表</a><div class="create-hero"><div><h1>新增患者</h1><p>先完成患者建档，可继续录入首次病例；未完成内容可暂存后补。</p></div><div class="create-actions"><input id="ai-files" type="file" accept="image/*" multiple hidden><button id="ai-import" class="button" type="button">AI纸质病历拍照导入</button></div></div>
<div id="ai-panel" class="ai-drop" hidden><div><strong>已选择病历照片</strong><p>AI 识别后将按模块回填，保存前请医生核对。</p><div id="import-files" class="import-files"></div></div><button id="recognize" class="button primary" type="button">开始 AI 识别</button></div>
<div class="create-layout"><form class="create-main" id="create-form">
<details class="create-section" id="basic" open><summary class="create-section-head"><h2>基本信息</h2><span>患者身份与人口学资料</span><span class="section-toggle" aria-hidden="true"></span></summary><div class="create-section-body"><div class="form-grid">
<label class="form-field"><span>患者姓名 <b class="required">*</b></span><input name="name" required placeholder="请输入患者姓名"></label><label class="form-field"><span>患者手机号</span><input name="phone" inputmode="tel" placeholder="请输入手机号"></label><label class="form-field"><span>患者身份证号</span><input name="idcard" placeholder="请输入身份证号"></label>
<label class="form-field"><span>研究编号</span><input name="studyNo" placeholder="保存后可自动生成"></label><label class="form-field"><span>ID号</span><input name="patientId" placeholder="保存后可自动生成"></label><label class="form-field"><span>民族</span><input name="ethnicity" placeholder="如：汉族"></label>
<div class="form-field"><span>性别</span><div class="choice-row"><label><input type="radio" name="sex" value="男">男</label><label><input type="radio" name="sex" value="女">女</label></div></div><label class="form-field"><span>出生日期</span><input type="date" name="birth"></label><label class="form-field"><span>婚史</span><select name="marital"><option value="">请选择</option><option>未婚</option><option>已婚</option><option>离异</option><option>丧偶</option></select></label>
<label class="form-field"><span>身高 (cm)</span><input type="number" step="0.1" name="height"></label><label class="form-field"><span>体重 (kg)</span><input type="number" step="0.1" name="weight"></label><label class="form-field"><span>随访观察起始</span><input type="date" name="followStart"></label><label class="form-field"><span>随访周期 <b class="required">*</b></span><select name="followCycle" required><option value="3">每 3 个月（疾病活动期）</option><option value="6" selected>每 6 个月</option><option value="12">每 12 个月（长期稳定）</option></select></label>
</div></div></details>
<div id="case-sections"></div>
<div class="create-footer"><small>可先暂存草稿</small><div class="create-actions"><button id="draft" class="button" type="button">暂存草稿</button><button class="button primary" type="submit">保存并完成建档</button></div></div></form></div></main></div></body></html>
