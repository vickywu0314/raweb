<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b57d0"><link rel="icon" href="img/logo.svg" type="image/svg+xml"><link rel="stylesheet" href="css/common.css?v=53"><link rel="stylesheet" href="css/shared/ai-analytics.css?v=53"><link rel="stylesheet" href="css/pages/ai-chat.css?v=53"><script src="js/boot.js?v=53" defer></script><script src="js/data.js?v=53" defer></script><script src="js/common.js?v=55" defer></script><script src="js/shared/ai-analytics.js?v=53" defer></script><script src="js/pages/ai-chat.js?v=53" defer></script><title>研究数据对话 · 患者数据研究平台</title></head><body><header class="app-header"><a class="brand" href="projects.html"><img src="img/logo.svg" width="38" height="38" alt=""><span>患者数据研究平台<small>Patient Data Research Platform</small></span></a><div class="header-actions"><div class="account"><span class="avatar">陈</span><span>陈医生<small>研究者</small></span></div></div></header><div class="app-layout"><aside class="sidebar"></aside><main id="main"><div class="breadcrumb">智能分析 <span>/</span> <a href="ai-analysis.html">AI 智能分析</a> <span>/</span> 研究数据对话</div>
<div class="page-heading"><div><h1>研究数据对话</h1><p>围绕研究库、当前队列或单个患者提问；每个回答附数据依据，可一键转为队列分析。</p></div><span class="demo-flag">演示数据 · 规则计算</span></div>
<div class="chat-layout">
<aside class="chat-side ai-panel"><h2>对话范围</h2><div class="scope-list" id="scope-list">
<label><input type="radio" name="scope" value="all" checked><span><b>整个研究库</b><small id="scope-all-note"></small></span></label>
<label id="scope-cohort-wrap" hidden><input type="radio" name="scope" value="cohort"><span><b>当前队列</b><small id="scope-cohort-note"></small></span></label>
<label><input type="radio" name="scope" value="patient"><span><b>单个患者</b><small>选择后针对该患者的病程提问</small></span></label>
</div><div class="picker" id="patient-picker" hidden><input id="picker" type="search" autocomplete="off" placeholder="输入姓名、ID号或研究编号" aria-label="选择患者"><div class="picker-list" id="picker-list" hidden></div></div>
<h2 class="side-title">推荐问题</h2><div class="suggest-list" id="suggest"></div>
<p class="side-note">演示版按关键词识别问题类型，支持：达标率、疾病活动分布、治疗分组、FM 影响、资料缺失、找出某类患者、单个患者病程。</p></aside>
<section class="chat-main ai-panel"><div class="chat-log" id="chat-log" aria-live="polite"></div>
<form class="chat-compose" id="chat-form"><input id="chat-input" autocomplete="off" placeholder="输入你的问题，例如：TNFi 患者 6 个月达标率如何？"><button class="button ai-button" type="submit">发送</button></form></section>
</div></main></div></body></html>
