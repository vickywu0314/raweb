<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="img/logo.svg" type="image/svg+xml"><link rel="stylesheet" href="css/common.css?v=56"><link rel="stylesheet" href="css/shared/ai-analytics.css?v=53"><link rel="stylesheet" href="css/pages/ai-chat.css?v=56"><script src="js/boot.js?v=56" defer></script><script src="js/pages/ai-cohort-conditions.js?v=4" defer></script><script src="js/pages/ai-chat-entry.js?v=1" defer></script><script src="js/pages/ai-cohort-api.js?v=16" defer></script><script src="js/shared/user-display.js?v=6" defer></script><script src="js/pages/ai-chat.js?v=58" defer></script><title>研究数据对话 · 患者数据研究平台</title></head><body><header class="app-header"><a class="brand" href="projects.html"><img src="img/logo.svg" width="38" height="38" alt=""><span>患者数据研究平台<small>Patient Data Research Platform</small></span></a><div class="header-actions"><span id="chat-account"></span></div></header><div class="app-layout"><aside class="sidebar"><nav aria-label="主导航"><p class="nav-label">智能分析</p><div class="sidebar-nav-group"><a class="nav-item" href="ai-analysis.html">智能分析</a><a class="nav-item" href="ai-cohort.html">队列分析</a><a class="nav-item active" href="ai-chat.html" aria-current="page">研究数据对话</a></div></nav></aside><main id="main"><div class="breadcrumb">智能分析 <span>/</span> 研究数据对话</div><div class="page-heading"><div><h1>研究数据对话</h1><p id="scope-subtitle" aria-live="polite">请选择范围后提交问题。</p></div><a id="chat-return" class="button" href="ai-analysis.html">返回智能分析</a></div>
<div class="chat-layout"><aside class="chat-side ai-panel"><h2>对话范围</h2><div class="scope-list" id="scope-list"><label><input id="scope-all" type="radio" name="scope" value="ALL" checked><span><b>整个研究库</b><small id="scope-all-note">提交后显示本轮人数</small></span></label><label id="scope-cohort-wrap" hidden><input id="scope-cohort" type="radio" name="scope" value="COHORT"><span><b>完整当前队列</b><small id="scope-cohort-note"></small></span></label><label><input id="scope-patient" type="radio" name="scope" value="PATIENT"><span><b>单个患者</b><small id="scope-patient-note">搜索并选择本人患者</small></span></label></div><div id="patient-picker" hidden><form id="patient-search"><label for="patient-keyword">搜索本人 RA 患者</label><input id="patient-keyword" maxlength="400" autocomplete="off" placeholder="输入姓名、ID号或研究编号"><button class="button" type="submit">搜索</button></form><p id="patient-search-state" role="status">请搜索患者</p><div id="patient-results"></div><div class="patient-pages"><button class="button" id="patient-prev" type="button" disabled>上一页</button><span id="patient-page"></span><button class="button" id="patient-next" type="button" disabled>下一页</button><button class="button" id="patient-search-cancel" type="button" hidden>取消搜索</button></div></div><div id="patient-focus" hidden><button class="button" id="patient-course" type="button">查看/询问患者全程</button><button class="button" id="patient-visit" type="button" hidden>返回原本次访视</button></div><h2 class="side-title">推荐问题</h2><div class="suggest-list" id="suggest"></div><p class="side-note">问题不改变范围。需要另一人群时，请返回条件页修改。统计是描述性或探索性的，不提供诊疗建议，不表示因果。</p></aside><section class="chat-main ai-panel"><p id="chat-state" role="status" data-state="idle">请选择范围后提交问题</p><div class="chat-log" id="chat-log" aria-live="polite"></div><form class="chat-compose" id="chat-form"><input id="chat-input" autocomplete="off" maxlength="2000" placeholder="请输入当前范围的数据问题" aria-label="研究数据问题"><button id="chat-send" class="button ai-button" type="submit">发送</button><button id="chat-cancel" class="button" type="button" hidden>取消</button></form></section></div></main></div></body></html>
