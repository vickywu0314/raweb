<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b57d0"><link rel="icon" href="img/logo.svg" type="image/svg+xml"><link rel="stylesheet" href="css/common.css?v=53"><link rel="stylesheet" href="css/shared/patient-list.css?v=53"><link rel="stylesheet" href="css/pages/followups.css?v=53"><script src="js/boot.js?v=53" defer></script><script src="js/data.js?v=53" defer></script><script src="js/common.js?v=61" defer></script><script src="js/pages/followups.js?v=53" defer></script><title>随访管理 · 患者数据研究平台</title></head><body><header class="app-header"><a class="brand" href="projects.html"><img src="img/logo.svg" width="38" height="38" alt=""><span>患者数据研究平台<small>Patient Data Research Platform</small></span></a><div class="header-actions"><div class="account"><span class="avatar">陈</span><span>陈医生<small>研究者</small></span></div></div></header><div class="app-layout"><aside class="sidebar"></aside><main id="main"><div class="breadcrumb">研究执行 <span>/</span> 随访管理</div><div class="page-heading"><div><h1>随访管理</h1><p id="fu-summary">集中查看待随访、逾期和近期随访患者，减少研究执行中的遗漏。</p></div></div><section class="quality-summary" id="fu-kpi"></section><form id="search-form" class="toolbar" role="search"><label class="search-field"><img src="img/search.svg" alt=""><input id="query" type="search" placeholder="按姓名、ID号或研究编号检索"></label><label class="select-field"><select id="fu-status" aria-label="随访状态"><option value="">全部随访状态</option><option value="overdue">已逾期</option><option value="soon">14 天内到期</option><option value="later">待随访</option></select></label><label class="select-field"><select id="fu-plan" aria-label="随访周期"><option value="">全部随访周期</option><option value="3">每 3 个月</option><option value="6">每 6 个月</option><option value="12">每 12 个月</option></select></label><button class="button primary" type="submit">查询</button><button class="button" id="reset" type="button">重置</button></form><div
