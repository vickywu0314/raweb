<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b57d0"><link rel="icon" href="img/logo.svg" type="image/svg+xml"><link rel="stylesheet" href="css/common.css?v=55"><link rel="stylesheet" href="css/shared/patient-list.css?v=53"><link rel="stylesheet" href="css/pages/followups.css?v=56"><script src="js/boot.js?v=54" defer></script><script src="js/data.js?v=53" defer></script><script src="js/common.js?v=66" defer></script><script src="js/pages/followups.js?v=58" defer></script><title>随访管理 · 患者数据研究平台</title></head><body><header class="app-header"><a class="brand" href="projects.html"><img src="img/logo.svg" width="38" height="38" alt=""><span>患者数据研究平台<small>Patient Data Research Platform</small></span></a><div class="header-actions"><div class="account"><span class="avatar">陈</span><span>陈医生<small>研究者</small></span></div></div></header><div class="app-layout"><aside class="sidebar"></aside><main id="main"><div class="breadcrumb">研究执行 <span>/</span> 随访管理</div><div class="page-heading"><div><h1>随访管理</h1><p id="fu-summary">集中查看待随访、逾期和近期随访患者，减少研究执行中的遗漏。</p></div></div><section class="quality-summary" id="fu-kpi"></section><form id="search-form" class="toolbar" role="search"><label class="search-field"><img src="img/search.svg" alt=""><input id="query" type="search" placeholder="按姓名、ID号或研究编号检索"></label><label class="select-field"><select id="fu-status" aria-label="随访状态"><option value="">全部（不含疑似失访）</option><option value="pending_first">待首次随访</option><option value="overdue">随访逾期</option><option value="soon">近期需随访（14 天内）</option><option value="active">随访中</option><option value="lost">疑似失访（超过 2 年未随访）</option></select></label><label class="select-field"><select id="fu-plan" aria-label="随访周期"><option value="">全部随访周期</option><option value="3">每 3 个月</option><option value="6">每 6 个月</option><option value="12">每 12 个月</option><option value="24">每 24 个月</option></select></label><button class="button primary" type="submit">查询</button><button class="button" id="reset" type="button">重置</button></form><div class="list-actions-bar"><button class="button primary" id="add-followup" type="button" disabled title="先在列表中选择一位患者">＋ 新增随访</button><span class="pick-hint" id="pick-hint">在列表中选择一位患者后录入本次随访</span></div><div class="patient-columns selectable"><span class="check-col" aria-hidden="true"></span><span>患者信息</span><span>研究信息</span><span>随访计划</span><span>预计日期</span><span>随访状态</span><span></span></div><div id="rows" class="patient-list" role="radiogroup" aria-label="选择要新增随访的患者"></div><div id="empty" class="empty-state" hidden><h2>没有匹配的随访计划</h2></div><footer class="pagination-bar"><p id="result-count"></p><div class="pagination-controls"><nav id="pagination"></nav><label class="page-size"><select id="page-size"><option value="8">每页 8 条</option><option value="16">每页 16 条</option><option value="32">每页 32 条</option></select></label></div></footer><p class="app-footnote">只列出您名下、未脱落的患者。预计日期 = 最近一次随访日期 + 患者的随访周期（在患者档案中设置：3 / 6 / 12 / 24 个月）；还没有随访的患者，预计日期取建档日期（基线随访）。最近一次随访（没有随访取建档日期）超过 2 年的算「疑似失访」，不计入上面的统计，可在状态里单独筛选。</p></main></div></body></html>
